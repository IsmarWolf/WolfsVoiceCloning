# voice_config.toml - settings for narrate.py
# Paths assume everything lives in C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning. Change them if you put it elsewhere.
# In TOML, single-quoted strings keep Windows backslashes as-is.

[general]
default_lang   = "pt"
ffmpeg         = "ffmpeg"
sample_rate    = 44100
pause_ms       = 250      # silence between sentences/chunks
loudness_lufs  = -16      # Instagram/TikTok-friendly loudness
speed          = 1.0      # 1.1 = 10% faster (pitch kept)
spell_numbers  = true     # "37%" -> "trinta e sete por cento" (needs: pip install num2words)

[routing]                 # which engine speaks each language
pt = "chatterbox"         # or "f5tts" once you have a fine-tuned pt checkpoint
en = "gptsovits"

# ---------------------------------------------------------------- GPT-SoVITS (English)
[gptsovits]
root           = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\GPT-SoVITS'
python         = 'C:\Users\IsmarWolf\miniconda3\envs\GPTSoVits\python.exe'
host           = "127.0.0.1"
port           = 9880
config         = 'GPT_SoVITS/configs/tts_infer.yaml'
# your fine-tuned weights (file names appear after training; pick the latest/best epoch)
gpt_weights    = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\GPT-SoVITS\GPT_weights_v2Pro\ismar-e15.ckpt'
sovits_weights = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\GPT-SoVITS\SoVITS_weights_v2Pro\ismar_e8_s400.pth'
# a clean 4-9 s clip from your dataset + its exact transcript
ref_audio      = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\dataset\wavs\session2_en_01_0007.wav'
ref_text       = "Put the exact words of the reference clip here."
ref_lang       = "en"
top_k          = 15
top_p          = 1.0
temperature    = 1.0
repetition_penalty = 1.35
max_chars      = 220
rvc            = false

# ---------------------------------------------------------------- Chatterbox (Portuguese)
[chatterbox]
python         = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\venvs\chatterbox\Scripts\python.exe'
device         = "cuda"
ref_audio      = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\dataset\wavs\Treino_pt_01_0053.wav'
exaggeration   = 0.5      # 0.3 calmer ... 0.7 more expressive
cfg_weight     = 0.5      # lower (0.3) = slower, more deliberate pacing
seed           = 0
max_chars      = 250
rvc            = true     # pass the output through your RVC model for your exact timbre

# ---------------------------------------------------------------- F5-TTS (backup / compare)
[f5tts]
cli            = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\venvs\f5tts\Scripts\f5-tts_infer-cli.exe'
model          = "F5TTS_v1_Base"
ckpt_file      = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\F5-TTS\ckpts\ismar_pt\model_last.pt'
vocab_file     = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\F5-TTS\data\ismar_pt_custom\vocab.txt'
ref_audio      = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\dataset\wavs\Treino_pt_01_0053.wav'
ref_text       = "texto exato do clipe de referência."
nfe_step       = 32
rvc            = false

# ---------------------------------------------------------------- RVC post-pass
# Uses the RVC repo's own CLI (python -m infer.cli, run inside the RVC folder).
# {input} and {output} are filled in by narrate.py; any other {key} comes from this table.
# model_name is a file in RVC\assets\weights - set it to the checkpoint you picked with compare_checkpoints.py.
[rvc]
cwd            = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\RVC'
python         = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\RVC\.venv\Scripts\python.exe'
model_name     = "ismar_e100_s4200.pth"
index_path     = 'C:\Users\IsmarWolf\Projetos\WolfsVoiceCloning\RVC\assets\indices\ismar_added_IVF1983_Flat_nprobe_1_ismar_v2.index'
f0method       = "rmvpe"
index_rate     = 0.5      # 0 = ignore the index, 1 = lean on it fully (can sound harsh)
protect        = 0.33
command = ["{python}", "-W", "ignore", "-m", "infer.cli",
           "--model", "{model_name}", "--input", "{input}", "--output", "{output}",
           "--index", "{index_path}", "--index-rate", "{index_rate}",
           "--f0-method", "{f0method}", "--protect", "{protect}", "--overwrite"]
