# voice_config.toml - settings for narrate.py and the studio.
# Every path left out is filled in automatically (see portable.py): the Python environments the app
# created, the RVC folder, ffmpeg, and the model / index / reference clip of the ACTIVE voice
# (the voice you cloned in the "Clonar voz" tab; its choice is remembered in settings.json).
# Relative paths are relative to this folder.

[general]
default_lang   = "pt"
ffmpeg         = "ffmpeg"  # "ffmpeg" = use the one the app downloaded, else the one on PATH
sample_rate    = 44100
pause_ms       = 250       # silence between sentences/chunks
loudness_lufs  = -16       # Instagram/TikTok-friendly loudness
speed          = 1.0       # 1.1 = 10% faster (pitch kept)
spell_numbers  = true      # "37%" -> "trinta e sete por cento" (needs num2words in the prep venv)

[routing]                  # which engine speaks each language
pt = "chatterbox"
en = "chatterbox"          # Chatterbox multilingual v3 speaks English too; "gptsovits" is the optional advanced route

# ---------------------------------------------------------------- Chatterbox (pt + en)
[chatterbox]
# python / device / ref_audio / rvc come from the active voice and the hardware profile
exaggeration   = 0.5       # 0.3 calmer ... 0.7 more expressive
cfg_weight     = 0.5       # lower (0.3) = slower, more deliberate pacing
seed           = 0
max_chars      = 250

# ---------------------------------------------------------------- RVC post-pass (your exact timbre)
[rvc]
# cwd / python / model_name / index_path come from the active voice
f0method       = "rmvpe"
index_rate     = 0.5       # 0 = ignore the index, 1 = lean on it fully (can sound harsh)
protect        = 0.33

# ---------------------------------------------------------------- optional, NOT set up by the app
# GPT-SoVITS (English only, advanced): install it by hand as in 02_TRAINING_GUIDE.md and use routing en = "gptsovits".
[gptsovits]
root           = 'GPT-SoVITS'
python         = 'GPT-SoVITS/.venv/Scripts/python.exe'
host           = "127.0.0.1"
port           = 9880
config         = 'GPT_SoVITS/configs/tts_infer.yaml'
gpt_weights    = ''
sovits_weights = ''
ref_audio      = ''
ref_text       = "Put the exact words of the reference clip here."
ref_lang       = "en"
top_k          = 15
top_p          = 1.0
temperature    = 1.0
repetition_penalty = 1.35
max_chars      = 220
rvc            = false

# F5-TTS (backup / compare), optional and NOT set up by the app.
[f5tts]
cli            = 'venvs/f5tts/Scripts/f5-tts_infer-cli.exe'
model          = "F5TTS_v1_Base"
ckpt_file      = ''
vocab_file     = ''
ref_audio      = ''
ref_text       = "texto exato do clipe de referência."
nfe_step       = 32
rvc            = false
