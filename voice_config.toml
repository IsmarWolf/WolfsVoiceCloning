# voice_config.toml - settings for narrate.py
# Paths assume everything lives in C:\Users\IsmarWolf\VoiceClone. Change them if you put it elsewhere.
# In TOML, single-quoted strings keep Windows backslashes as-is.

[general]
default_lang   = "pt"
ffmpeg         = "ffmpeg"
sample_rate    = 44100
pause_ms       = 250      # silence between sentences/chunks
loudness_lufs  = -16      # Instagram/TikTok-friendly loudness
speed          = 1.0      # 1.1 = 10% faster (pitch kept)
spell_numbers  = true     # "37%" -> "trinta e sete por cento" (needs: pip install num2words)

[routing]                 # which engine speaks each language
pt = "chatterbox"         # or "f5tts" once you have a fine-tuned pt checkpoint
en = "gptsovits"

# ---------------------------------------------------------------- GPT-SoVITS (English)
[gptsovits]
root           = 'C:\Users\IsmarWolf\VoiceClone\GPT-SoVITS'
python         = 'C:\Users\IsmarWolf\miniconda3\envs\GPTSoVits\python.exe'
host           = "127.0.0.1"
port           = 9880
config         = 'GPT_SoVITS/configs/tts_infer.yaml'
# your fine-tuned weights (file names appear after training; pick the latest/best epoch)
gpt_weights    = 'C:\Users\IsmarWolf\VoiceClone\GPT-SoVITS\GPT_weights_v2Pro\ismar-e15.ckpt'
sovits_weights = 'C:\Users\IsmarWolf\VoiceClone\GPT-SoVITS\SoVITS_weights_v2Pro\ismar_e8_s400.pth'
# a clean 4-9 s clip from your dataset + its exact transcript
ref_audio      = 'C:\Users\IsmarWolf\VoiceClone\dataset\wavs\session2_en_01_0007.wav'
ref_text       = "Put the exact words of the reference clip here."
ref_lang       = "en"
top_k          = 15
top_p          = 1.0
temperature    = 1.0
repetition_penalty = 1.35
max_chars      = 220
rvc            = false

# ---------------------------------------------------------------- Chatterbox (Portuguese)
[chatterbox]
python         = 'C:\Users\IsmarWolf\VoiceClone\venvs\chatterbox\Scripts\python.exe'
device         = "cuda"
ref_audio      = 'C:\Users\IsmarWolf\VoiceClone\dataset\wavs\session1_pt_01_0003.wav'
exaggeration   = 0.5      # 0.3 calmer ... 0.7 more expressive
cfg_weight     = 0.5      # lower (0.3) = slower, more deliberate pacing
seed           = 0
max_chars      = 250
rvc            = true     # pass the output through your RVC model for your exact timbre

# ---------------------------------------------------------------- F5-TTS (backup / compare)
[f5tts]
cli            = 'C:\Users\IsmarWolf\VoiceClone\venvs\f5tts\Scripts\f5-tts_infer-cli.exe'
model          = "F5TTS_v1_Base"
ckpt_file      = 'C:\Users\IsmarWolf\VoiceClone\F5-TTS\ckpts\ismar_pt\model_last.pt'
vocab_file     = 'C:\Users\IsmarWolf\VoiceClone\F5-TTS\data\ismar_pt_custom\vocab.txt'
ref_audio      = 'C:\Users\IsmarWolf\VoiceClone\dataset\wavs\session1_pt_01_0003.wav'
ref_text       = "texto exato do clipe de referência."
nfe_step       = 32
rvc            = false

# ---------------------------------------------------------------- RVC post-pass
# Uses RVC WebUI's tools/infer_cli.py. {input} and {output} are filled in by narrate.py;
# any other {key} comes from this table.
[rvc]
cwd            = 'C:\Users\IsmarWolf\VoiceClone\RVC'
python         = 'C:\Users\IsmarWolf\VoiceClone\RVC\.venv\Scripts\python.exe'
model_name     = "ismar.pth"                   # file in RVC\assets\weights
index_path     = 'C:\Users\IsmarWolf\VoiceClone\RVC\logs\ismar\added_ismar.index'
f0method       = "rmvpe"
index_rate     = 0.5
protect        = 0.33
command = ["{python}", "tools/infer_cli.py",
           "--input_path", "{input}", "--opt_path", "{output}",
           "--model_name", "{model_name}", "--index_path", "{index_path}",
           "--f0method", "{f0method}", "--f0up_key", "0",
           "--index_rate", "{index_rate}", "--protect", "{protect}",
           "--device", "cuda:0", "--is_half", "True"]
